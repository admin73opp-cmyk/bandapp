# Auth config for Ritovo (bandapp) — email template overrides
# Production values preserved from the linked project

[auth]
site_url = "https://ritovo.net"
additional_redirect_urls = ["https://ritovo.net", "https://ritovo.net/", "https://bandapp-six.vercel.app", "https://bandapp-six.vercel.app/", "https://bandapp.app", "https://bandapp.app/"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "25s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Confirm your Ritovo account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Ritovo email"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.magic_link]
subject = "Your Ritovo sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your Ritovo password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "Your Ritovo password was changed"
content_path = "./supabase/templates/password-changed.html"

# rsvp-remind authorizes every path itself (cron secret / RSVP token / member
# JWT), so platform-level JWT verification is disabled — the daily pg_cron call
# and the logged-out one-click /rsvp page must both be able to reach it.
[functions.rsvp-remind]
verify_jwt = false

# calendar-feed must stay public: Google/Apple/Outlook poll the ICS URL with
# no auth — the per-band feed token in the URL is the secret. Without this a
# config-driven redeploy re-enables JWT verification and 401s every
# subscribed calendar. (Deployed manually with --no-verify-jwt until now.)
[functions.calendar-feed]
verify_jwt = false
