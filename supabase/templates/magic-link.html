<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f4f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f8;padding:40px 20px">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
      <tr><td align="center" style="padding-bottom:28px">
        <table cellpadding="0" cellspacing="0" align="center"><tr>
          <td valign="bottom" style="border-left:1.5px solid #1a1a18;padding:10px 0 8px 14px;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:300;letter-spacing:9px;color:#1a1a18;line-height:1;white-space:nowrap">ritovo</td>
          <td valign="top" style="padding:8px 0 0 2px;line-height:1;font-size:0"><span style="display:inline-block;width:5px;height:5px;background:#1a1a18;border-radius:50%;font-size:0;line-height:0"> </span></td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#ffffff;border-radius:12px;padding:36px 40px;box-shadow:0 2px 8px rgba(0,0,0,0.07)">
        <p style="margin:0 0 20px;font-size:16px;color:#1a1a2e;font-weight:600">Your sign-in link</p>
        <p style="margin:0 0 4px;font-size:15px;color:#444;line-height:1.6">Click the button below to sign in to Ritovo. This link expires in <strong>1 hour</strong>.</p>
        <table cellpadding="0" cellspacing="0" style="margin:28px 0">
          <tr><td style="background:#6C63FF;border-radius:8px">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px">Sign In to Ritovo →</a>
          </td></tr>
        </table>
        <p style="margin:0;font-size:12px;color:#999;line-height:1.6">If you didn't request this link, you can safely ignore this email.<br>
        If the button doesn't work: <a href="{{ .ConfirmationURL }}" style="color:#6C63FF;word-break:break-all">{{ .ConfirmationURL }}</a></p>
      </td></tr>
      <tr><td align="center" style="padding-top:24px"><p style="margin:0;font-size:12px;color:#aaa">© Ritovo</p></td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
